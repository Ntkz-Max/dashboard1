<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-----------------------   CSS  ----------------->
    <link rel="stylesheet" href="style.css">


    <!-----------------------   BOXICONS   ----------------->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <title> Dashboard Side bar Menu  </title>
    <link rel="icon" href="favicon.ico">
</head>

<body>
  <nav class="sidebar">
      <header>
          <div class="image-text">
              <span class="image">
                  <img src="img/Newspaper.jpg" alt="logo">
              </span>

              <div class="text header-text">
                  <span class="name">Newsletter</span>
                  <span class="profession">Daily News</span>
              </div>
          </div>
          <i class='bx bx-chevrons-right toggle'></i>
      </header>

      <div class="menu-bar">
          <div class="menu">
              <li class="search-box">
                  <i class='bx bx-search-alt icon'></i>
                  <input type="text" placeholder="  Search...">
              </li>
              <ul class="menu-links">
                  <li class="nav-link">
                      <a href="/Skeleton/Index.html">
                          <i class='bx bx-home icon'></i>
                          <span class="text nav-text">Dashboard</span>
                      </a>
                  </li>
                  <li class="nav-link">
                      <a href="/Skeleton/Publish.html">
                          <i class='bx bxl-blogger icon'></i>
                          <span class="text nav-text">Publish</span>
                      </a>
                  </li>
                  <li class="nav-link">
                      <a href="/Skeleton/History.html">
                          <i class='bx bx-history icon'></i>
                          <span class="text nav-text">History</span>
                      </a>
                  </li>
              </ul>
          </div>


          <div class="bottom-content">
              <li class="">
                  <a href="#">
                      <i class='bx bx-log-out icon'></i>
                      <span class="text nav-text">Logout</span>
                  </a> 
              </li>

              <li class="mode">
                  <div class="moon-sun">
                      <i class='bx bx-moon icon moon'></i>
                      <i class='bx bx-sun icon sun'></i>
                  </div>
                  <span class="mode-text text">Dark Mode</span>

                  <div class="toggle-switch">
                      <span class="switch"></span>
                  </div>
              </li>

          </div>
      </div>
  </nav>

  <script src="script.js"></script>
</body>
</html>
